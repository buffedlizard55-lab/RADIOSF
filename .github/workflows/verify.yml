name: verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild feed and refuse drift
        run: |
          python3 scripts/build_feed.py
          git diff --exit-code -- data/broadcasts.json docs/LINE_BY_LINE.md
      - name: Read-only source-watch regression tests
        run: |
          python3 scripts/source_watch_test.py
          python3 scripts/wwo_watch_test.py
          python3 scripts/page_watch_test.py
          python3 scripts/tbd_time_watch_test.py
          python3 scripts/espn_watch_test.py
          python3 scripts/espn_radio_week_watch_test.py
      - name: UI logic and feed invariants
        run: node scripts/ui_logic_test.js
      - name: Render the real page against the real feed
        run: node scripts/render_smoke_test.js
