name: verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild feed and refuse drift
        run: |
          python3 scripts/build_feed.py
          git diff --exit-code -- data/broadcasts.json docs/LINE_BY_LINE.md
      - name: UI logic
        run: node scripts/ui_logic_test.js
