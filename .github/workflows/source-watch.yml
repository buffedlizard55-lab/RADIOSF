name: source watch
on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compare future MLB postseason schedule with the checked-in snapshot
        id: watch
        continue-on-error: true
        run: |
          python3 scripts/source_watch.py \
            --report "$RUNNER_TEMP/mlb-source-watch.md" \
            --github-output "$GITHUB_OUTPUT"
      - name: Add source-watch report to the run summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/mlb-source-watch.md" ]; then
            cat "$RUNNER_TEMP/mlb-source-watch.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The source-watch script did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Open or refresh a review issue when the monitor needs attention
        if: always() && steps.watch.outputs.status != 'clear'
        uses: actions/github-script@v7
        env:
          SOURCE_WATCH_STATUS: ${{ steps.watch.outputs.status }}
          SOURCE_WATCH_REPORT: ${{ runner.temp }}/mlb-source-watch.md
        with:
          script: |
            const fs = require('fs');
            const status = process.env.SOURCE_WATCH_STATUS || 'unavailable';
            const report = fs.existsSync(process.env.SOURCE_WATCH_REPORT)
              ? fs.readFileSync(process.env.SOURCE_WATCH_REPORT, 'utf8')
              : 'The monitor did not produce a report. Check the failed workflow run; the feed status is unknown.';
            const title = '[Automated source watch] MLB postseason schedule needs review';
            const { owner, repo } = context.repo;
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100
            });
            const existing = openIssues.find(issue => !issue.pull_request && issue.title === title);
            const body = `${report}\n\nMonitor status: **${status}**. This automation never edits or publishes the static feed.`;
            if (existing) {
              const stable = value => value
                .replace(/^- Checked:.*\n/m, '')
                .replace(/^- Pacific date used for comparison:.*\n/m, '');
              if (stable(existing.body || '') !== stable(body)) {
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
                core.info(`Updated existing review issue #${existing.number}`);
              } else {
                core.info(`Existing review issue #${existing.number} already has the same source difference`);
              }
            } else {
              const { data: issue } = await github.rest.issues.create({ owner, repo, title, body });
              core.info(`Created review issue #${issue.number}`);
            }
